# Planted faults for the critical modules (scripts/mutants, the table scripts/mutants.toml): each
# night one group of modules, in turn by the day of the year; by hand one group, or all of them as
# one job a group. A job fails when a module's score is below the floor the table records. Not part
# of what a push must pass. No secrets, nothing is published but the scores.
name: mutants

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      group:
        description: "the group of scripts/mutants.toml to run (1-4), or all"
        required: true
        default: "all"

permissions:
  contents: read

env:
  NEOAPRS_UPDATE_CHECK: "0"
  UV_FROZEN: "1"

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - name: The group of tonight, or the ones asked for
        id: groups
        env:
          ASKED: ${{ github.event.inputs.group }}
        run: |
          case "${ASKED:-}" in
            "") groups="[$(( 10#$(date -u +%j) % 4 + 1 ))]" ;;
            all) groups="[1, 2, 3, 4]" ;;
            [1-4]) groups="[$ASKED]" ;;
            *) echo "no group $ASKED" >&2; exit 2 ;;
          esac
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  mutants:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step uses git with the job's token
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --group mutants
      - name: Planted faults against the floors
        env:
          GROUP: ${{ matrix.group }}
        run: scripts/mutants --group "$GROUP" --check
      - name: The scores
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.group }}
          path: build/mutants/scores.json
          if-no-files-found: ignore
