# What a push or a pull request must pass: the Python half (lock, ruff, mypy, the tests) on Linux and on Windows, the smoke test of the built wheel on both, and the page's half (type check, lint, tests,
# and neoaprs/page/ is what ui/ builds, and the two duplication ratchets). On Linux every step is a stage of scripts/check (`scripts/check --stage NAME`), so that what runs here cannot differ from what is run
# before a push, nor from the container of scripts/check-in-container, which runs these steps in this order; Windows has no bash script and runs the commands themselves. No secrets, nothing is published.
# The weekly audit of the packages is another workflow (audit.yml): the release asks for a green run of this one by the commit, and a scheduled run of this file would be one.
name: ci

on:
  push:
    branches: [master, "ci/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:          # (by hand, on any branch: the same jobs, the simulation included)

permissions:
  contents: read

env:
  NEOAPRS_UPDATE_CHECK: "0"          # no daemon of a smoke step asks the version page
  UV_FROZEN: "1"          # uv never changes uv.lock here: a lock that is not current fails (uv lock --check below says so)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}          # a branch keeps only its newest run; every push to master is checked to the end (the release workflow asks for that commit's run)

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      # The extra `app` is installed, so that the desktop app is type-checked and tested against the real toolkits: Qt with its web engine on Linux (the headless test needs the system libraries of Chromium), pywebview and pystray on Windows (their stand-ins run everywhere).
      - name: System libraries of the Qt web engine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libnss3 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxkbfile1
      - run: uv sync --frozen --extra app --extra ble
      # Linux: the stages of scripts/check. mypy runs for both systems on Linux, the one runner that has every toolkit (Windows has no Qt): one tree must type-check for both, and its test files too. The suite is run by
      # the stage pytest with tests/test_package.py and tests/test_desktop_qt.py each on one worker (xdist_group), and leaves the layers to the stage architecture and the page's build to the job `page`.
      - run: scripts/check --stage lock
        if: runner.os == 'Linux'
      - run: scripts/check --stage ruff
        if: runner.os == 'Linux'
      - run: scripts/check --stage mypy
        if: runner.os == 'Linux'
      - run: scripts/check --stage architecture
        if: runner.os == 'Linux'
      - run: scripts/check --stage pytest
        if: runner.os == 'Linux'
      # Windows: the same checks as commands (the suite there holds the layers and skips the page's build too).
      - run: env -u UV_FROZEN uv lock --check
        if: runner.os == 'Windows'
        shell: bash
      - run: uv run ruff check .
        if: runner.os == 'Windows'
      - run: uv run pytest -n auto --dist loadgroup
        if: runner.os == 'Windows'

  # The wheel as a user gets it: built, installed into a fresh environment, and the installed command run against a fake TNC (scripts/smoke.py), on both systems.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv build --wheel
      - name: Install the wheel into a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/smoke-venv"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$RUNNER_TEMP/smoke-venv/Scripts"; EXE=.exe; else BIN="$RUNNER_TEMP/smoke-venv/bin"; EXE=; fi
          echo "SMOKE_BIN=$BIN" >> "$GITHUB_ENV"
          echo "SMOKE_EXE=$EXE" >> "$GITHUB_ENV"
          uv pip install --python "$BIN/python$EXE" dist/*.whl
      - name: Smoke test
        run: |
          "$SMOKE_BIN/python$SMOKE_EXE" scripts/smoke.py --command "$SMOKE_BIN/neoaprs$SMOKE_EXE"

  page:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install, type check, lint, test
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npx vue-tsc --noEmit
          npm run lint
          npm run format:check
          npm run knip
          npm test
      # The duplication ratchets: jscpd over ui/src, and over neoaprs/ and tests/support/ against scripts/dup-baseline.json (scripts/check runs them with the Python of the venv).
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: scripts/check --stage dup
      - run: scripts/check --stage dup-py
      # The page's own test (tests/test_page_build.py: what the daemon serves is what ui/ builds, under its Content-Security-Policy), which the stage pytest of the Linux job leaves out.
      - run: scripts/check --stage page
      # build-page installs nothing here: ui/node_modules is what the lockfile says since the first step.
      - name: The committed page is what ui/ builds
        run: |
          scripts/build-page
          git add --intent-to-add neoaprs/page
          git diff --exit-code -- neoaprs/page

  # The simulation of an HF net with real Mercury instances (scripts/mercury-sim; docs/development.md, "The simulators"): the pinned Mercury built from source as the release's `mercury` job builds it, then five
  # Mercury instances on the suite's simulated channel, a daemon on each, and the scenario checked to the end: every beacon heard, the longest message around the ring, a collision, a lost ack, a Mercury that dies, a
  # daemon restarted mid-conversation, a weak link, a poor fading channel at 0 dB, both radios, the iGate. About six minutes (the scenario waits on the air, not on the CPU); the report is an artifact, and the
  # daemons' and Mercury's logs too when it failed. The same as `scripts/check --stage sim`.
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: The tools of the Mercury build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libasound2-data
      - run: uv sync --frozen
      # The Mercury built once is kept for as long as what the build reads stays: the script, the pins in neoaprs/mercury.py, the patches and the stub of packaging/mercury, and the runner's image (its compiler and
      # libraries). The folder is what `--install` makes in the venv, which uv sync leaves alone.
      - name: The image of the runner, for the key of the cache
        id: image
        run: echo "name=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: The Mercury built before
        id: mercury
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv/tools/mercury
          key: mercury-sim-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.name }}-${{ hashFiles('scripts/build-mercury', 'neoaprs/mercury.py', 'packaging/mercury/**') }}
      - name: Build the pinned Mercury into the venv (scripts/build-mercury --install)
        if: steps.mercury.outputs.cache-hit != 'true'
        run: uv run scripts/build-mercury --install
      - name: The simulation
        shell: bash          # (an explicit bash runs with -eo pipefail: the status of the step is the simulation's and not `tee`'s)
        run: uv run scripts/mercury-sim --report mercury-sim.json --keep 2>&1 | tee mercury-sim.log
      - name: The report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mercury-sim
          path: |
            mercury-sim.json
            mercury-sim.log
          if-no-files-found: ignore
      - name: The folders of the run (the daemons' logs, Mercury's output), when it failed
        if: failure()
        run: |
          folder="$(sed -n 's/^sim: kept \(.*\): .*/\1/p' mercury-sim.log | tail -n 1)"
          [ -n "$folder" ] && tar czf mercury-sim-folders.tar.gz -C "$folder" . || echo "no folder kept"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mercury-sim-folders
          path: mercury-sim-folders.tar.gz
          if-no-files-found: ignore
