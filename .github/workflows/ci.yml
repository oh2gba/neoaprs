# What a push or pull request must pass: the Python half (lock, ruff, mypy, tests) on Linux and
# Windows, the smoke test of the built wheel on both, and the page's half (type check, lint, tests,
# neoaprs/page/ is what ui/ builds, two duplication ratchets). On Linux every step is a stage of
# scripts/check, so CI cannot differ from a local run or from the container of
# scripts/check-in-container; Windows runs the commands itself. No secrets, nothing is published.
# Runners are named, not `-latest`, so a result does not depend on the day GitHub moves a label:
# packaging/ci/runner.json lists them, the weekly audit says when a label moves, and every setup-uv
# installs the uv of packaging/ci/Dockerfile (tests/test_check_in_container.py checks all three).
# The weekly package audit is another workflow (audit.yml): the release requires a green run of this
# one.
name: ci

on:
  push:
    branches: [master, "ci/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:  # by hand on any branch: the same jobs, the simulation included

permissions:
  contents: read

env:
  NEOAPRS_UPDATE_CHECK: "0"  # no smoke-step daemon asks the version page
  UV_FROZEN: "1"  # uv never changes uv.lock here: a stale lock fails (uv lock --check below)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}  # a branch keeps only its newest run; every push to master is checked to the end

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step uses git with the job's token
      # This runner's system against packaging/ci/runner.json (scripts/runner-facts): a differing
      # fact fails the job, since the container of scripts/check-in-container would no longer match.
      # The image version is a notice.
      - name: The runner is what runner.json says
        if: runner.os == 'Linux'
        run: python3 scripts/runner-facts --here --github
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.13"
          enable-cache: true
      # The extra `app` is installed so the desktop app is tested against the real toolkits: Qt with
      # its web engine on Linux (needs Chromium's system libraries), pywebview and pystray on
      # Windows.
      - name: System libraries of the Qt web engine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libnss3 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxkbfile1
      - run: uv sync --frozen --extra app --extra ble
      # Linux: the stages of scripts/check. mypy runs for both systems here, the one runner with
      # every toolkit: one tree must type-check for both. The suite leaves the layers to the stage
      # architecture and the page build to `page`; tests/test_package.py and
      # tests/test_desktop_qt.py each run on one worker (xdist_group).
      - run: scripts/check --stage lock
        if: runner.os == 'Linux'
      - run: scripts/check --stage ruff
        if: runner.os == 'Linux'
      - run: scripts/check --stage mypy
        if: runner.os == 'Linux'
      - run: scripts/check --stage architecture
        if: runner.os == 'Linux'
      - run: scripts/check --stage pytest
        if: runner.os == 'Linux'
      # Windows: the same checks as commands.
      - run: env -u UV_FROZEN uv lock --check
        if: runner.os == 'Windows'
        shell: bash
      - run: uv run ruff check .
        if: runner.os == 'Windows'
      - run: uv run pytest -n auto --dist loadgroup
        if: runner.os == 'Windows'

  # The wheel as a user gets it: built, installed into a fresh environment, run against a fake TNC
  # (scripts/smoke.py), on both systems.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step uses git with the job's token
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.13"
          enable-cache: true
      - run: uv build --wheel
      - name: Install the wheel into a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/smoke-venv"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$RUNNER_TEMP/smoke-venv/Scripts"; EXE=.exe; else BIN="$RUNNER_TEMP/smoke-venv/bin"; EXE=; fi
          echo "SMOKE_BIN=$BIN" >> "$GITHUB_ENV"
          echo "SMOKE_EXE=$EXE" >> "$GITHUB_ENV"
          uv pip install --python "$BIN/python$EXE" dist/*.whl
      - name: Smoke test
        run: |
          "$SMOKE_BIN/python$SMOKE_EXE" scripts/smoke.py --command "$SMOKE_BIN/neoaprs$SMOKE_EXE"

  page:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step uses git with the job's token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install, type check, lint, test
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npx vue-tsc --noEmit
          npm run lint
          npm run format:check
          npm run knip
          npm test
      # Duplication ratchets: jscpd over ui/src, and over neoaprs/ and tests/support/ against
      # scripts/dup-baseline.json.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: scripts/check --stage dup
      - run: scripts/check --stage dup-py
      # The page's own test (tests/test_page_build.py), which the stage pytest of the Linux job
      # leaves out.
      - run: scripts/check --stage page
      # Every outside link the page, the manual, the site and the README offer (scripts/linkcheck.py).
      - run: scripts/check --stage links
      # build-page installs nothing: ui/node_modules is current since the first step.
      - name: The committed page is what ui/ builds
        run: |
          scripts/build-page
          git add --intent-to-add neoaprs/page
          git diff --exit-code -- neoaprs/page

  # The HF net simulation with real Mercury instances (scripts/mercury-sim; docs/development.md,
  # "The simulators"): the pinned Mercury built as the release's `mercury` job builds it, five
  # instances on the suite's simulated channel, a daemon on each, and a scenario checked to the end.
  # About six minutes. The report is an artifact, with the logs on failure. The same as
  # `scripts/check --stage sim`.
  sim:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step uses git with the job's token
      - name: The runner is what runner.json says
        run: python3 scripts/runner-facts --here --github
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.13"
          enable-cache: true
      - name: The tools of the Mercury build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libasound2-data
      - run: uv sync --frozen
      # The built Mercury is kept while what the build reads stays the same: the script, the pins in
      # neoaprs/mercury.py, the patches and stub of packaging/mercury, and the runner image. The
      # folder is what `--install` makes in the venv.
      - name: The image of the runner, for the key of the cache
        id: image
        run: echo "name=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: The Mercury built before
        id: mercury
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv/tools/mercury
          key: mercury-sim-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.name }}-${{ hashFiles('scripts/build-mercury', 'neoaprs/mercury.py', 'packaging/mercury/**') }}
      - name: Build the pinned Mercury into the venv (scripts/build-mercury --install)
        if: steps.mercury.outputs.cache-hit != 'true'
        run: uv run scripts/build-mercury --install
      - name: The simulation
        shell: bash  # explicit bash runs with -eo pipefail: the step's status is the simulation's, not tee's
        run: uv run scripts/mercury-sim --report mercury-sim.json --keep 2>&1 | tee mercury-sim.log
      - name: The report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mercury-sim
          path: |
            mercury-sim.json
            mercury-sim.log
          if-no-files-found: ignore
      - name: The folders of the run (the daemons' logs, Mercury's output), when it failed
        if: failure()
        run: |
          folder="$(sed -n 's/^sim: kept \(.*\): .*/\1/p' mercury-sim.log | tail -n 1)"
          [ -n "$folder" ] && tar czf mercury-sim-folders.tar.gz -C "$folder" . || echo "no folder kept"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mercury-sim-folders
          path: mercury-sim-folders.tar.gz
          if-no-files-found: ignore
