# What a release is made of, built by GitHub: the Windows installer (PyInstaller and Inno Setup), the Linux AppImage, the macOS app (a disk image, for Apple silicon), the Debian packages for amd64 and arm64 (the Raspberry Pi), the source tarball (the sdist,
# for packagers; the wheel it is built with is build material and not a file of the release) and SHA256SUMS. The Windows installer, the AppImage, the macOS app and the packages carry the pinned Mercury HF modem (neoaprs/mercury.py), built from its source by NeoAPRS in each: the job `mercury-windows` for the installer, the job `mercury` in the Linux ones, the `macos` job's own build in the app. Pushing a tag `v*` builds all of it, checks it (the wheel, the installed Windows app, the AppImage, the macOS app and the packages installed with apt are each run against a fake TNC), updates the installed Windows app and the AppImage to a next version with Update now from a fake release (scripts/update-e2e.py), and creates the release. Run by hand (workflow_dispatch) on a branch it is
# a dry run: the same builds and checks, the files kept as the artifacts of the run, and no release; run by hand on a tag (`gh workflow run release.yml --ref v<version>`) it publishes that tag's release again. A tag run that
# failed is run again with "Re-run failed jobs" (every artifact may be written over, the release is made as a draft and an existing one is added to), never by moving the tag. How to make a release: docs/MAINTAINING.md,
# "A release"; what the jobs do: docs/development.md.
name: release
# A run on a tag is a release; a run by hand on a branch is a build for testing (docs/MAINTAINING.md, "A build for testing"): the name says which.
run-name: "${{ github.ref_type == 'tag' && format('release {0}', github.ref_name) || format('build for testing: {0} @ {1}', github.ref_name, github.sha) }}"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEOAPRS_UPDATE_CHECK: "0"          # no daemon of a smoke step asks the version page
  UV_FROZEN: "1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag names the version that is in the code, the changelog has the notes for it and nothing left under Unreleased, the committed page is what ui/ builds, the commit is on master and CI has passed
  # for it: each a few seconds, before anything is built.
  verify:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read          # gh run list: the runs of ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
          fetch-depth: 0     # (the whole history with master: the tag's commit must be on it)
      - name: The tag, VERSION and CHANGELOG.md agree
        run: |
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/__init__.py)"
          [ -n "$version" ] || { echo "::error::no VERSION in neoaprs/__init__.py"; exit 1; }
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "::error::the tag $GITHUB_REF_NAME is not v$version (VERSION in neoaprs/__init__.py)"; exit 1; }
          python3 scripts/release-notes.py "$version" > /dev/null || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - name: Nothing is left under Unreleased in CHANGELOG.md
        run: |
          grep -q '^## Unreleased' CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## Unreleased' heading (add an empty one above the section of this version)"; exit 1; }
          awk '/^## Unreleased/ { inside = 1; next } /^## / { inside = 0 } inside && NF { print; found = 1 } END { exit found }' CHANGELOG.md \
            || { echo "::error::CHANGELOG.md still has notes under '## Unreleased' (above): move them into the section of this version"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: "The committed page is what ui/ builds (it has no version in it: a release that changed nothing in ui/ leaves it as it is)"
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          scripts/build-page
          git add --intent-to-add neoaprs/page
          git diff --exit-code -- neoaprs/page || { echo "::error::neoaprs/page/ is not what ui/ builds: run scripts/build-page and commit neoaprs/page/"; exit 1; }
      - name: The commit is on master
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::$GITHUB_SHA is not on origin/master: push master first, then the tag"; exit 1; }
      - name: CI has passed for this commit (a run still going is waited for, up to 20 minutes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 40); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[] | .status + " " + .conclusion')"
            if echo "$runs" | grep -q '^completed success$'; then echo "ci.yml passed for $GITHUB_SHA"; exit 0; fi
            if [ -n "$runs" ] && ! echo "$runs" | grep -qv '^completed '; then echo "::error::ci.yml did not pass for $GITHUB_SHA ($(echo "$runs" | paste -sd ';')): fix master, then run this workflow again on the tag"; exit 1; fi
            echo "ci.yml for $GITHUB_SHA: ${runs:-no run yet}; waiting 30 s"
            sleep 30
          done
          echo "::error::ci.yml for $GITHUB_SHA did not finish within 20 minutes: when it is green, run this workflow again on the tag (gh workflow run release.yml --ref $GITHUB_REF_NAME)"; exit 1

  wheel:
    needs: verify
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build the wheel and the sdist (the wheel is built from the sdist)
        run: |
          uv build --out-dir dist
          ls -l dist
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/__init__.py)"
          wheel_version="$(python3 -c 'import sys; from neoaprs.updateasset import wheel_version; print(wheel_version(sys.argv[1]))' "$version")"          # 0.10.0-rc1 is 0.10.0rc1 in the names the build makes (PEP 440)
          [ -f "dist/neoaprs-$wheel_version-py3-none-any.whl" ] && [ -f "dist/neoaprs-$wheel_version.tar.gz" ] && [ "$(ls dist | wc -l)" = 2 ]
      - name: Smoke test of the wheel in a fresh environment
        run: |
          uv venv "$RUNNER_TEMP/smoke-venv"
          uv pip install --python "$RUNNER_TEMP/smoke-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke-venv/bin/python" scripts/smoke.py --command "$RUNNER_TEMP/smoke-venv/bin/neoaprs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          overwrite: true

  # The app as a folder with three programs (the console one, the daemon, the desktop app), then the installer around it; both are smoke tested, the second one installed and uninstalled for real.
  windows:
    needs: [verify, mercury-windows]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: The version
        id: version
        run: echo "version=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/__init__.py)" >> "$GITHUB_OUTPUT"
      - name: Build environment, from the wheel and the locked dependencies with the extra app (pywebview, pystray, Pillow) and PyInstaller of the group `pyinstaller`, every file by the hash the lock holds
        # PyInstaller from its source with the bootloader compiled here (the runner's MSVC), not the bootloader of the wheel, which every program packed with it shares, malware included: Windows
        # Defender's guess took NeoAPRS for a trojan (4 Nov 2026)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          uv build --wheel --out-dir dist-wheel
          uv export --frozen --no-dev --no-emit-project --extra app --group pyinstaller -o build-requirements.txt
          uv venv build-venv
          uv pip install --python build-venv/Scripts/python.exe --require-hashes --no-binary pyinstaller -r build-requirements.txt
          uv pip install --python build-venv/Scripts/python.exe --no-deps dist-wheel/*.whl
          build-venv/Scripts/python.exe -c "import PyInstaller, pathlib; run = pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'run.exe'; print('the bootloader', run, run.stat().st_size, 'bytes')"
      - name: PyInstaller, run where there is no neoaprs/ folder, so that the installed wheel is what is frozen
        working-directory: packaging/windows
        run: ../../build-venv/Scripts/pyinstaller.exe --noconfirm --distpath ../../dist --workpath ../../build neoaprs.spec
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mercury-windows
          path: dist-mercury
      - name: The Mercury of the job mercury-windows, built from the pinned source, into bin/mercury/ (mercury.exe and the licences), and it starts and listens on this computer only
        run: |
          build-venv/Scripts/python.exe packaging/windows/bundle_mercury.py dist/NeoAPRS dist-mercury/mercury-*-windows-x86_64.tar.gz
          test -f dist/NeoAPRS/bin/mercury/mercury.exe
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/mercury.py)"
          [ -n "$version" ]
          said="$(dist/NeoAPRS/bin/mercury/mercury.exe -V 2>&1 || true)"
          echo "mercury.exe -V: $said"
          echo "$said" | grep -qF "$version"
          build-venv/Scripts/python.exe packaging/windows/smoke_mercury.py dist/NeoAPRS/bin/mercury/mercury.exe
      - name: The world map is in the frozen app (the page has a map from the first start; scripts/smoke.py then asks the daemon for it)
        run: test -f dist/NeoAPRS/_internal/neoaprs/maps/basemap-world.pmtiles
      - name: Smoke test of the app folder
        run: |
          dist/NeoAPRS/neoaprs.exe --version
          build-venv/Scripts/python.exe scripts/smoke.py --command "$(pwd -W)/dist/NeoAPRS/neoaprs.exe"
      - name: The frozen app cuts the map itself (a dry run reads the directories of the latest build and downloads no tiles)
        run: dist/NeoAPRS/neoaprs.exe map --data "$RUNNER_TEMP/mapdata" --lat 60.17 --lon 24.94 --radius 10 --maxzoom 8 --dry-run
      - name: Inno Setup
        shell: pwsh
        run: |
          # the runner image has Inno Setup; if it does not, chocolatey installs 6.7.1
          $find = { Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) { choco install innosetup --version=6.7.1 -y --no-progress; $iscc = & $find }
          if (-not $iscc) { throw "ISCC.exe was not found after the install" }
          $iscc.FullName
          & $iscc.FullName /Qp "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\neoaprs.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed: $LASTEXITCODE" }
          Get-ChildItem dist-installer | Format-Table Name, Length
      - name: Install silently, as a user without administrator rights
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist-installer\NeoAPRS-Setup-*.exe).FullName
          # (-Wait would wait for the daemon too, which the task started from the setup and which is meant to go on)
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/LOG=$PWD\install.log" -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "setup ended with $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\NeoAPRS"
          foreach ($f in 'neoaprs.exe', 'neoaprsw.exe', 'neoaprs-app.exe', 'bin\mercury\mercury.exe', '_internal\neoaprs\maps\basemap-world.pmtiles', 'LICENSE.txt', 'unins000.exe') { if (-not (Test-Path "$app\$f")) { throw "$f is not in $app" } }
          foreach ($l in 'NeoAPRS', 'Stop NeoAPRS', 'NeoAPRS support logs') { if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\NeoAPRS\$l.lnk")) { throw "no Start menu entry $l" } }
          # the task: start at sign-in is the app in the tray (the app starts the daemon), not the daemon
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').NeoAPRS
          if (-not $run -or $run -notlike '*neoaprs-app.exe*--tray*') { throw "the Run key is not set to the app in the tray: $run" }
          "Run key: $run"
          if ((Get-Item "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\NeoAPRS\NeoAPRS.lnk").Length -eq 0) { throw "empty Start menu entry" }
      - name: Smoke test of the installed app
        run: build-venv/Scripts/python.exe scripts/smoke.py --command "$LOCALAPPDATA\\Programs\\NeoAPRS\\neoaprs.exe"
      - name: The installed Mercury starts and listens on this computer only
        run: |
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/mercury.py)"
          said="$("$LOCALAPPDATA\\Programs\\NeoAPRS\\bin\\mercury\\mercury.exe" -V 2>&1 || true)"
          echo "mercury.exe -V: $said"
          echo "$said" | grep -qF "$version"
          build-venv/Scripts/python.exe packaging/windows/smoke_mercury.py "$LOCALAPPDATA\\Programs\\NeoAPRS\\bin\\mercury\\mercury.exe"
      - name: open and stop on a data folder of their own (what the Start menu entries run)
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\NeoAPRS"
          $data = "$env:RUNNER_TEMP\opendata"
          $url = & "$app\neoaprs.exe" open --no-browser --data $data
          if ($LASTEXITCODE -ne 0) { Get-Content "$data\neoaprs.log" -Tail 30; throw "open failed" }
          "page: $url"
          if ((Invoke-WebRequest $url -UseBasicParsing).StatusCode -ne 200) { throw "the page does not answer" }
          & "$app\neoaprs.exe" stop --data $data
          if ($LASTEXITCODE -ne 0) { throw "stop failed" }
          if ((Get-Content "$data\neoaprs.log" -Tail 1) -notlike '*NeoAPRS ended') { Get-Content "$data\neoaprs.log" -Tail 10; throw "the daemon did not end cleanly" }
      - name: support, what the Start menu entry "NeoAPRS support logs" runs
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\NeoAPRS"
          $data = "$env:RUNNER_TEMP\opendata"
          $out = "$env:RUNNER_TEMP\supportout"
          & "$app\neoaprs.exe" support --data $data --out $out
          if ($LASTEXITCODE -ne 0) { throw "support failed" }
          $zips = @(Get-ChildItem $out -Filter 'neoaprs-support-*.zip')
          if ($zips.Count -ne 1) { throw "no support file in $out" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($zips[0].FullName)
          try { $names = @($zip.Entries | ForEach-Object { $_.FullName }) } finally { $zip.Dispose() }
          foreach ($n in 'README.txt', 'summary.txt', 'settings.json', 'doctor.txt', 'database.txt', 'packets.txt', 'logs/neoaprs.log') { if ($names -notcontains $n) { throw "$n is not in the support file: $names" } }
          "support file: $($zips[0].Name), $($names.Count) files"
      - name: The app in the tray (neoaprs-app.exe --tray) starts its own daemon, and neoaprs stop ends both
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\NeoAPRS"
          $data = "$env:RUNNER_TEMP\appdata"
          New-Item -ItemType Directory $data -Force | Out-Null
          # (the app has no console: Start-Process returns at once)
          $p = Start-Process "$app\neoaprs-app.exe" -ArgumentList '--tray', '--data', $data -PassThru
          $url = $null
          foreach ($i in 1..60) {
            # (Select-String stops the step on a file that is not there yet, whatever -ErrorAction says)
            $m = if (Test-Path "$data\neoaprs.log") { Select-String -Path "$data\neoaprs.log" -Pattern 'web page at (http://\S+/)' | Select-Object -Last 1 }
            if ($m) { $url = $m.Matches[0].Groups[1].Value; break }
            if ($p.HasExited) { break }
            Start-Sleep 1
          }
          if (-not $url) { Get-Content "$data\neoaprs-app.log", "$data\neoaprs.log" -Tail 30 -ErrorAction SilentlyContinue; throw "no page: the app did not start its daemon" }
          "page: $url"
          if ((Invoke-WebRequest $url -UseBasicParsing).StatusCode -ne 200) { throw "the page does not answer" }
          if ($p.HasExited) { Get-Content "$data\neoaprs-app.log" -Tail 30; throw "the app ended by itself with $($p.ExitCode)" }
          Get-Content "$data\neoaprs-app.log" -Tail 5
          # a second app on the same folder ends at once (and would raise the first one's window; --tray does not)
          $q = Start-Process "$app\neoaprs-app.exe" -ArgumentList '--tray', '--data', $data -PassThru -Wait
          if ($q.ExitCode -ne 0) { throw "a second app ended with $($q.ExitCode)" }
          if ($p.HasExited) { throw "the second app ended the first" }
          # the daemon is the app's own: neoaprs stop ends it, and the app ends with it
          & "$app\neoaprs.exe" stop --data $data
          if ($LASTEXITCODE -ne 0) { throw "stop failed" }
          if (-not $p.WaitForExit(30000)) { Get-Content "$data\neoaprs-app.log" -Tail 30; throw "the app did not end after neoaprs stop" }
          if ((Get-Content "$data\neoaprs.log" -Tail 1) -notlike '*NeoAPRS ended') { Get-Content "$data\neoaprs.log" -Tail 10; throw "the daemon did not end cleanly" }
          # a daemon that was running before the app is only attached to, and survives it
          $data2 = "$env:RUNNER_TEMP\appdata2"
          $null = & "$app\neoaprs.exe" open --no-browser --data $data2
          if ($LASTEXITCODE -ne 0) { throw "open failed" }
          $p2 = Start-Process "$app\neoaprs-app.exe" -ArgumentList '--tray', '--data', $data2 -PassThru
          foreach ($i in 1..30) { if (Test-Path "$data2\neoaprs-app.port") { break }; Start-Sleep 1 }
          Start-Sleep 3
          & "$app\neoaprs-app.exe" --quit --data $data2
          if ($LASTEXITCODE -ne 0) { throw "quit failed" }
          if (-not $p2.WaitForExit(30000)) { throw "the attached app did not end after --quit" }
          if ((Get-Content "$data2\neoaprs.log" -Tail 1) -like '*NeoAPRS ended') { throw "the app stopped a daemon it did not start" }
          & "$app\neoaprs.exe" stop --data $data2
          if ($LASTEXITCODE -ne 0 -or (Get-Content "$data2\neoaprs.log" -Tail 1) -notlike '*NeoAPRS ended') { throw "the daemon that was there before the app did not survive it" }
      - name: Uninstall silently; the start at sign-in goes, the app and the daemon end, the data stays
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\NeoAPRS"
          # the app is running, with its daemon, when the uninstaller starts: it ends both
          $running = Start-Process "$app\neoaprs-app.exe" -ArgumentList '--tray' -PassThru
          foreach ($i in 1..60) { if ((Test-Path "$env:LOCALAPPDATA\NeoAPRS\neoaprs.log") -and (Select-String -Path "$env:LOCALAPPDATA\NeoAPRS\neoaprs.log" -Pattern 'NeoAPRS is running' -Quiet)) { break }; Start-Sleep 1 }
          if ($running.HasExited) { throw "the app did not stay up" }
          $u = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$PWD\uninstall.log" -PassThru
          $u.WaitForExit()
          # the uninstaller hands over to a copy of itself and returns at once: wait for the folder
          foreach ($i in 1..60) { if (-not (Test-Path "$app\neoaprs.exe")) { break }; Start-Sleep 1 }
          if (Test-Path "$app\neoaprs.exe") { Get-Content uninstall.log -Tail 40; throw "neoaprs.exe is still in $app" }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).NeoAPRS) { throw "the Run key is still set" }
          if (Get-Process -Name neoaprs, neoaprsw, neoaprs-app -ErrorAction SilentlyContinue) { throw "a NeoAPRS process is still running" }
          if (-not (Test-Path "$env:LOCALAPPDATA\NeoAPRS\neoaprs.sqlite")) { throw "the data folder was touched" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\NeoAPRS\NeoAPRS.lnk") { throw "the Start menu entry is still there" }
          "uninstalled; the data folder is still there"
      # Update now, end to end (scripts/update-e2e.py): a second installer of the next version, made from the same build with nothing changed but its VERSION, is the release a fake server on the loopback
      # serves; the installer above is installed again, and its daemon updates itself to the second one as a click of the page has it do, the installer of the update run silently by the daemon.
      - name: "Update now: the installer of the next version (VERSION alone changed)"
        id: next
        shell: bash
        run: |
          next="$(build-venv/Scripts/python.exe -I -c 'import sys; a, b, c = sys.argv[1].split("-")[0].split("."); print(f"{a}.{b}.{int(c) + 1}-e2e")' "${{ steps.version.outputs.version }}")"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          init=build-venv/Lib/site-packages/neoaprs/__init__.py
          sed -i "s/^VERSION = \"[^\"]*\"/VERSION = \"$next\"/" "$init"
          grep -q "^VERSION = \"$next\"" "$init"
          rm -rf build-venv/Lib/site-packages/neoaprs/__pycache__
          (cd packaging/windows && ../../build-venv/Scripts/pyinstaller.exe --noconfirm --distpath ../../dist-e2e --workpath ../../build-e2e neoaprs.spec)
          build-venv/Scripts/python.exe packaging/windows/bundle_mercury.py dist-e2e/NeoAPRS dist-mercury/mercury-*-windows-x86_64.tar.gz
          [ "$(dist-e2e/NeoAPRS/neoaprs.exe --version)" = "NeoAPRS $next" ]
      - name: "Update now: Inno Setup for the next version"
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          & $iscc.FullName /Qp "/DAppVersion=${{ steps.next.outputs.version }}" "/DBuildDir=..\..\dist-e2e\NeoAPRS" "/O$PWD\dist-e2e-installer" packaging\windows\neoaprs.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed: $LASTEXITCODE" }
          Get-ChildItem dist-e2e-installer | Format-Table Name, Length
      - name: "Update now, end to end: installed, updated by its daemon to the next version, started again on the same data folder"
        run: >-
          build-venv/Scripts/python.exe scripts/update-e2e.py windows
          "dist-installer/NeoAPRS-Setup-${{ steps.version.outputs.version }}.exe" "dist-e2e-installer/NeoAPRS-Setup-${{ steps.next.outputs.version }}.exe" --work "$RUNNER_TEMP/update-e2e"
      - name: The logs of setup and uninstall
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in 'install.log', 'uninstall.log') { if (Test-Path $f) { "--- $f"; Get-Content $f -Tail 60 } }
      - name: The logs of Update now's test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-e2e-windows-logs
          path: |
            ${{ runner.temp }}/update-e2e
            !${{ runner.temp }}/update-e2e/**/*.exe
          if-no-files-found: ignore
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist-installer/NeoAPRS-Setup-*.exe
          if-no-files-found: error
          overwrite: true

  # Mercury for the Windows installer: built from the pinned source (scripts/build-mercury --windows) on Linux with the MinGW-w64 cross compiler, in a Debian container with the packages Rhizomatica's own release workflow
  # builds its Windows zip with (gcc-mingw-w64-x86-64, mingw-w64-x86-64-dev, mingw-w64-common), so that the program is the pinned version with NeoAPRS's two patches (every port bound to the loopback, the lead-in of a radio
  # on VOX) and the Windows Firewall has nothing to do with it. The folder is one program that imports the DLLs of Windows alone; the tarball is what the job `windows` packs into the installer
  # (packaging/windows/bundle_mercury.py), which then starts the program and reads the system's table of sockets (packaging/windows/smoke_mercury.py).
  mercury-windows:
    needs: verify
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: debian:trixie
    steps:
      - name: The tools of the build (a bare container has none)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3 ca-certificates git patch file gcc-mingw-w64-x86-64 mingw-w64-x86-64-dev mingw-w64-common
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - name: Build Mercury for Windows from the pinned source
        run: python3 scripts/build-mercury --windows --tar --out dist-mercury-windows
      - name: It is the pinned version and one folder of plain files (the build has read the program's import table, 64-bit and no DLL of MinGW)
        run: |
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/mercury.py)"
          [ -n "$version" ]
          [ -f "dist-mercury-windows/mercury-$version-windows-x86_64.tar.gz" ] && [ "$(ls dist-mercury-windows/*.tar.gz | wc -l)" = 1 ]
          ls -l dist-mercury-windows dist-mercury-windows/mercury
          for f in LICENSE LICENSE-freedv SOURCE.txt mercury.exe; do [ -f "dist-mercury-windows/mercury/$f" ]; done
          [ "$(ls dist-mercury-windows/mercury | wc -l)" = 6 ]
          file dist-mercury-windows/mercury/mercury.exe
          grep -qaF "$version" dist-mercury-windows/mercury/mercury.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mercury-windows
          path: dist-mercury-windows/mercury-*-windows-*.tar.gz
          if-no-files-found: error
          overwrite: true

  # Mercury, the HF modem every Linux download carries: built from the pinned source (scripts/build-mercury) for each architecture, in ubuntu:22.04, so that the program asks
  # for glibc 2.35 at most, the floor the AppImage and the .deb document, and its one other library (ALSA) and that library's configuration travel in the folder. The folder is the tarball the two jobs below unpack
  # into their files. The container's Python is the 3.10 of Ubuntu 22.04: scripts/build-mercury runs on it.
  mercury:
    needs: verify
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container: ubuntu:22.04
    steps:
      - name: The tools of the build (a bare container has none)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libasound2-data python3 ca-certificates git patch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - name: Build Mercury from the pinned source
        run: python3 scripts/build-mercury --tar --out dist-mercury
      - name: It starts, and it is the pinned version (with the ALSA configuration it brought)
        run: |
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/mercury.py)"
          [ -n "$version" ]
          said="$(ALSA_CONFIG_PATH="$PWD/dist-mercury/mercury/share/alsa/alsa.conf" dist-mercury/mercury/mercury -V 2>&1 || true)"
          echo "mercury -V: $said"
          echo "$said" | grep -qF "$version"
          [ -f "dist-mercury/mercury-$version-linux-$(uname -m).tar.gz" ] && [ "$(ls dist-mercury/*.tar.gz | wc -l)" = 1 ]
          ls -l dist-mercury dist-mercury/mercury
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mercury-${{ matrix.arch }}
          path: dist-mercury/mercury-*-linux-*.tar.gz
          if-no-files-found: error
          overwrite: true

  # The Linux app as one file: CPython, the wheel and the locked dependencies of its extra app (Qt with the web engine) in an AppImage (scripts/build-appimage, from the wheel of the job above), then run as a user
  # would (scripts/smoke-appimage: the daemon, the page, the service unit, the window on the offscreen platform). ubuntu-22.04 and not latest: it has glibc 2.35, the oldest that the Qt wheels
  # inside (glibc 2.34) run on, so that the file is shown to run on the oldest system it claims (what is inside does not depend on the runner that builds it). GitHub retires a runner image some two years
  # after the next LTS: when ubuntu-22.04 goes, this job moves to ubuntu-24.04 and only loses that proof; the file itself stays the same.
  appimage:
    needs: [verify, wheel, mercury]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      # the tools the build scripts fetch (the CPython of python-build-standalone, appimagetool and its runtime), kept between runs for as long as their pins in the scripts stay
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/neoaprs-build
          key: neoaprs-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-appimage', 'scripts/build-deb') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mercury-amd64
          path: dist-mercury
      - name: FUSE, which the file mounts itself with, and the system libraries of the Qt web engine (the smoke test starts the window)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse libfuse2 libegl1 libgl1 libnss3 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxkbfile1
      - name: Build the AppImage from the wheel and the Mercury of the job above
        run: |
          scripts/build-appimage --wheel dist/neoaprs-*.whl --mercury dist-mercury/mercury-*-linux-x86_64.tar.gz --out dist-appimage
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/__init__.py)"
          [ -f "dist-appimage/NeoAPRS-$version-x86_64.AppImage" ] && [ "$(ls dist-appimage | wc -l)" = 1 ]
          ls -l dist-appimage
      - name: Smoke test of the file (Tornado for scripts/smoke.py comes from the wheel, in a fresh environment)
        run: |
          uv venv "$RUNNER_TEMP/smoke-venv"
          uv pip install --python "$RUNNER_TEMP/smoke-venv/bin/python" dist/*.whl
          scripts/smoke-appimage dist-appimage/NeoAPRS-*.AppImage --python "$RUNNER_TEMP/smoke-venv/bin/python"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist-appimage/NeoAPRS-*.AppImage
          if-no-files-found: error
          overwrite: true

  # Update now of the AppImage, end to end (scripts/update-e2e.py), on the newest Ubuntu: the file of the job above in a folder of its own runs as the daemon, and a fake server on the loopback serves a second
  # one, the same file with nothing changed but its VERSION (scripts/build-appimage --retag), as the next release. The daemon replaces its own file and goes on in the same process as the new version; once
  # mounted with FUSE, once unpacked (--appimage-extract-and-run, a system without FUSE).
  appimage-update:
    needs: [wheel, appimage]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/neoaprs-build
          key: neoaprs-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-appimage', 'scripts/build-deb') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: dist-appimage
      - name: FUSE, which the file mounts itself with
        run: |
          if ! command -v fusermount3 >/dev/null && ! command -v fusermount >/dev/null; then sudo apt-get update && sudo apt-get install -y --no-install-recommends fuse3; fi
          ls -l /dev/fuse
      - name: The AppImage of the next version (VERSION alone changed)
        id: next
        run: |
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/__init__.py)"
          next="$(python3 -I -c 'import sys; a, b, c = sys.argv[1].split("-")[0].split("."); print(f"{a}.{b}.{int(c) + 1}-e2e")' "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          scripts/build-appimage --retag "dist-appimage/NeoAPRS-$version-x86_64.AppImage" "$next" --out dist-e2e
          [ "$(APPIMAGE_EXTRACT_AND_RUN=1 "dist-e2e/NeoAPRS-$next-x86_64.AppImage" --version)" = "NeoAPRS $next" ]
      - name: "Update now, end to end: the file replaced in its place and the same process going on as the next version, mounted with FUSE and unpacked"
        run: |
          uv venv "$RUNNER_TEMP/e2e-venv"
          uv pip install --python "$RUNNER_TEMP/e2e-venv/bin/python" dist/*.whl
          old="dist-appimage/NeoAPRS-${{ steps.next.outputs.version }}-x86_64.AppImage"
          new="dist-e2e/NeoAPRS-${{ steps.next.outputs.next }}-x86_64.AppImage"
          "$RUNNER_TEMP/e2e-venv/bin/python" scripts/update-e2e.py appimage "$old" "$new" --work "$RUNNER_TEMP/update-e2e/fuse"
          "$RUNNER_TEMP/e2e-venv/bin/python" scripts/update-e2e.py appimage "$old" "$new" --work "$RUNNER_TEMP/update-e2e/extract-and-run" --extract-and-run
      - name: The logs of Update now's test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-e2e-appimage-logs
          path: |
            ${{ runner.temp }}/update-e2e
            !${{ runner.temp }}/update-e2e/**/*.AppImage*
            !${{ runner.temp }}/update-e2e/*/tmp
          if-no-files-found: ignore
          overwrite: true

  # The macOS app as a disk image: the CPython of python-build-standalone for Apple silicon, the wheel and the locked dependencies of its extra app (Qt with the web engine) laid out as NeoAPRS.app, with Mercury built from
  # the pinned source on the same runner (scripts/build-mercury on a Mac: CoreAudio alone, for macOS 14 and newer; Rhizomatica's own universal build asks for macOS 26), everything signed ad hoc (there is no Apple
  # developer account), then opened and run as a user would (scripts/smoke-macos-app: the signature, the daemon, the page, the launchd agent, the window on the offscreen platform). macos-latest is Apple silicon; what
  # the app asks of a Mac (macOS 14, the floor of the Qt wheels) does not depend on the runner that builds it.
  macos:
    needs: [verify, wheel]
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/neoaprs-build
          key: neoaprs-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-macos-app') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Build Mercury from the pinned source, for macOS 14 and newer (the Python of setup-uv runs the script)
        run: |
          python="$(uv python find 3.13)"
          "$python" scripts/build-mercury --tar --out dist-mercury
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/mercury.py)"
          [ -n "$version" ] && [ -f "dist-mercury/mercury-$version-macos-arm64.tar.gz" ] && [ "$(ls dist-mercury/*.tar.gz | wc -l | tr -d ' ')" = 1 ]
      - name: Build the app and its disk image from the wheel and that Mercury
        run: |
          scripts/build-macos-app --wheel dist/neoaprs-*.whl --mercury dist-mercury/mercury-*-macos-arm64.tar.gz --out dist-macos
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/__init__.py)"
          [ -f "dist-macos/NeoAPRS-$version-arm64.dmg" ] && [ "$(ls dist-macos | wc -l | tr -d ' ')" = 1 ]
          ls -l dist-macos
      - name: Smoke test of the image (Tornado for scripts/smoke.py comes from the wheel, in a fresh environment)
        run: |
          uv venv "$RUNNER_TEMP/smoke-venv"
          uv pip install --python "$RUNNER_TEMP/smoke-venv/bin/python" dist/*.whl
          scripts/smoke-macos-app dist-macos/NeoAPRS-*.dmg --python "$RUNNER_TEMP/smoke-venv/bin/python"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app
          path: dist-macos/NeoAPRS-*.dmg
          if-no-files-found: error
          overwrite: true

  # The Debian package for the Raspberry Pi, Debian and Ubuntu (scripts/build-deb, from the wheel of the job above: CPython and the locked dependencies in /opt/neoaprs), one for each architecture, each built and
  # tried on a runner of its own: installed with apt, the command, the daemon against a fake TNC with the Python of the package, the unit a service install writes, an upgrade over itself, and the removal.
  deb:
    needs: [verify, wheel, mercury]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/neoaprs-build
          key: neoaprs-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-appimage', 'scripts/build-deb') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mercury-${{ matrix.arch }}
          path: dist-mercury
      - name: Build the package from the wheel and the Mercury of this architecture
        run: |
          scripts/build-deb --arch "${{ matrix.arch }}" --wheel dist/neoaprs-*.whl --mercury dist-mercury/mercury-*-linux-*.tar.gz --out dist-deb
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/__init__.py)"
          [ -f "dist-deb/neoaprs_${version}_${{ matrix.arch }}.deb" ] && [ "$(ls dist-deb | wc -l)" = 1 ]
          ls -l dist-deb
          dpkg-deb --info dist-deb/*.deb
          dpkg-deb --contents dist-deb/*.deb | grep -v ' ./opt/neoaprs/lib/python3.13/'
      - name: Install it with apt, then the command and the daemon against a fake TNC (the Python of the package runs the smoke test, so that nothing of the system's Python is used)
        run: |
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/__init__.py)"
          sudo apt install -y ./dist-deb/*.deb
          [ "$(neoaprs --version)" = "NeoAPRS $version" ]
          [ "$(readlink -f /usr/bin/neoaprs)" = /opt/neoaprs/bin/neoaprs ]
          [ -f /usr/share/doc/neoaprs/copyright ]
          /opt/neoaprs/bin/python3 -I -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
          /opt/neoaprs/bin/python3 -I - "${{ matrix.arch }}" <<'PY'
          import sys
          from pathlib import Path
          from neoaprs.cli.installkind import detect_here
          info = detect_here(Path("/nonexistent"))
          assert (info.kind, info.arch) == ("deb", sys.argv[1]), info
          PY
          /opt/neoaprs/bin/python3 -I scripts/smoke.py --command /usr/bin/neoaprs
          mercury_version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/mercury.py)"
          said="$(ALSA_CONFIG_PATH=/opt/neoaprs/tools/mercury/share/alsa/alsa.conf /opt/neoaprs/tools/mercury/mercury -V 2>&1 || true)"
          echo "mercury -V: $said"
          echo "$said" | grep -qF "$mercury_version"
          [ -f /opt/neoaprs/tools/mercury/LICENSE ] && [ ! -e /opt/neoaprs/tools/mercury/dev ]
      - name: "Mercury needs nothing of the system: a bare Debian 12 without the ALSA library installs the package and runs it (ldd finds the bundled library, nothing missing)"
        run: |
          mercury_version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/mercury.py)"
          docker run --rm -i -e MERCURY_VERSION="$mercury_version" -v "$PWD/dist-deb:/pkg:ro" debian:bookworm-slim sh -s <<'SH'
          set -eu
          apt-get update -qq
          apt-get install -y -qq /pkg/*.deb
          # (a `!` does not stop a script under set -e: the checks are ifs)
          if dpkg -s libasound2 > /dev/null 2>&1; then echo "libasound2 is installed here: the proof proves nothing"; exit 1; fi
          bundled=/opt/neoaprs/tools/mercury
          ldd "$bundled/mercury" | tee /tmp/ldd.txt
          if grep -q 'not found' /tmp/ldd.txt; then echo "a library of mercury is missing"; exit 1; fi
          grep -q "$bundled/lib/libasound.so.2" /tmp/ldd.txt
          export ALSA_CONFIG_PATH="$bundled/share/alsa/alsa.conf"
          said="$("$bundled/mercury" -V 2>&1 || true)"
          echo "mercury -V: $said"
          echo "$said" | grep -qF "$MERCURY_VERSION"
          # (-z opens the sound system: with no sound card it lists none, and it must neither fail to load nor crash)
          status=0
          "$bundled/mercury" -z > /tmp/z.txt 2>&1 || status=$?
          cat /tmp/z.txt
          if [ "$status" -ge 126 ] || grep -q 'error while loading' /tmp/z.txt; then echo "mercury -z did not run (exit $status)"; exit 1; fi
          SH
      - name: A service install writes a unit that starts the Python of the package (a HOME and a systemctl of the test's own)
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/fakebin"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/fakebin/systemctl"
          cp "$RUNNER_TEMP/fakebin/systemctl" "$RUNNER_TEMP/fakebin/loginctl"
          chmod +x "$RUNNER_TEMP/fakebin/systemctl" "$RUNNER_TEMP/fakebin/loginctl"
          HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/.config" PATH="$RUNNER_TEMP/fakebin:$PATH" neoaprs service install --data "$RUNNER_TEMP/servicedata"
          grep -n '^ExecStart=/opt/neoaprs/bin/python3 -m neoaprs ' "$RUNNER_TEMP/home/.config/systemd/user/neoaprs.service"
      - name: Install it over itself (an upgrade), then remove it; the data of a user stays
        shell: bash          # (-eo pipefail: a failing apt is the step's failure and not tee's success)
        run: |
          mkdir -p "$RUNNER_TEMP/keep"
          echo data > "$RUNNER_TEMP/keep/neoaprs.sqlite"
          sudo apt install -y --reinstall ./dist-deb/*.deb 2>&1 | tee upgrade.log
          grep -q 'keeps the old version until it is restarted' upgrade.log
          neoaprs --version
          sudo apt remove -y neoaprs
          [ ! -e /opt/neoaprs ] && [ ! -e /usr/bin/neoaprs ] && ! dpkg -s neoaprs 2>/dev/null | grep -q 'Status: install ok installed'
          [ "$(cat "$RUNNER_TEMP/keep/neoaprs.sqlite")" = data ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.arch }}
          path: dist-deb/neoaprs_*.deb
          if-no-files-found: error
          overwrite: true

  # Everything a release carries in one place, with the checksums and the notes: made on a dry run too, so that this half is tried before a tag.
  assemble:
    needs: [wheel, windows, appimage, appimage-update, macos, deb]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      # the files of the release and nothing else: not the logs a failed update test left in an earlier attempt of this run
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{dist,windows-installer,appimage,macos-app,deb-amd64,deb-arm64}"
          path: release-files
          merge-multiple: true
      - name: SHA256SUMS and the notes
        run: |
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' neoaprs/__init__.py)"
          wheel_version="$(python3 -c 'import sys; from neoaprs.updateasset import wheel_version; print(wheel_version(sys.argv[1]))' "$version")"
          cd release-files
          # the wheel and install.sh stay files of the release for the copies installed with the install line before 0.16: their update window runs
          # `curl -LsSf .../releases/latest/download/install.sh | sh`, which installs the wheel (such a copy has no Mercury; the supported installs carry it)
          url="https://github.com/oh2gba/neoaprs/releases/download/v$version/neoaprs-$wheel_version-py3-none-any.whl"
          sed -e "s|@VERSION@|$version|g" -e "s|@WHEEL_URL@|$url|g" ../packaging/install.sh.in > install.sh
          chmod +x install.sh
          ! grep -n '@[A-Z_]*@' install.sh
          sh -n install.sh
          for f in "neoaprs-$wheel_version.tar.gz" "neoaprs-$wheel_version-py3-none-any.whl" install.sh "NeoAPRS-Setup-$version.exe" "NeoAPRS-$version-x86_64.AppImage" "NeoAPRS-$version-arm64.dmg" "neoaprs_${version}_amd64.deb" "neoaprs_${version}_arm64.deb"; do [ -f "$f" ] || { echo "::error::$f is missing"; exit 1; }; done
          # the installer, the AppImage, the macOS app and the two packages also under names without the version, so that the project page can link to
          # releases/latest/download/NAME and the download starts at once (the self-update asks for the versioned names)
          cp -- "NeoAPRS-Setup-$version.exe" NeoAPRS-Setup.exe
          cp -- "NeoAPRS-$version-x86_64.AppImage" NeoAPRS-x86_64.AppImage
          cp -- "NeoAPRS-$version-arm64.dmg" NeoAPRS-arm64.dmg
          cp -- "neoaprs_${version}_amd64.deb" neoaprs_amd64.deb
          cp -- "neoaprs_${version}_arm64.deb" neoaprs_arm64.deb
          [ "$(ls | wc -l)" = 13 ] || { echo "::error::unexpected files"; ls -l; exit 1; }
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cd ..
          if [ "${GITHUB_REF_TYPE}" = tag ]; then notes_for="$version"; else notes_for=""; fi
          python3 scripts/release-notes.py $notes_for > notes.md
          printf '\nThe files are checked by SHA256SUMS, which is signed (SHA256SUMS.sig, checked by Update now), and carry build provenance (`gh attestation verify FILE --repo oh2gba/neoaprs`). Windows: run NeoAPRS-Setup-%s.exe (SmartScreen may warn about an unsigned installer: More info, Run anyway). Linux: make NeoAPRS-%s-x86_64.AppImage executable and run it. macOS (Apple silicon, macOS 14 or newer): open NeoAPRS-%s-arm64.dmg and drag NeoAPRS to Applications; the first time, right-click it and choose Open (the app is not signed by Apple). Raspberry Pi, Debian, Ubuntu: `sudo apt install ./neoaprs_%s_arm64.deb` (amd64 for a PC), then `neoaprs service install --linger`.\n' "$version" "$version" "$version" "$version" >> notes.md
          head -c 600 notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            release-files/*
            notes.md
          if-no-files-found: error
          overwrite: true

  # Only a tag makes a release: one pushed, or one the workflow is run on by hand. The release is made as a draft and stays one: scripts/release signs its SHA256SUMS with the project's key, which is not on
  # GitHub, uploads SHA256SUMS.sig and publishes it, so that no half of one and no unsigned one is ever seen. A run on a tag whose draft exists (a run before it got this far) writes the files and the notes over
  # again and deletes a SHA256SUMS.sig that is no longer the signature of the new SHA256SUMS, so that a failed run is simply run again; a release that is published is never written over.
  release:
    needs: assemble
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: files
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: files/release-files/*
      - name: Create the release as a draft (or write over the files of the draft that is there), for scripts/release to sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac          # 1.0.0-rc1 is a pre-release: never "latest", so the project page's links and the version page do not offer it to everyone
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::the release $GITHUB_REF_NAME is published: it is never written over"; exit 1
            fi
            echo "the draft $GITHUB_REF_NAME is there already: its files and notes are written over, and its signature deleted"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber files/release-files/*
            gh release delete-asset "$GITHUB_REF_NAME" SHA256SUMS.sig --repo "$GITHUB_REPOSITORY" --yes 2> /dev/null || true
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease="$prerelease" --title "NeoAPRS $version" --notes-file files/notes.md files/release-files/*
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease="$prerelease" --title "NeoAPRS $version" --notes-file files/notes.md
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets --jq '"\(.url) draft=\(.isDraft) prerelease=\(.isPrerelease) \(.assets | length) files"'
