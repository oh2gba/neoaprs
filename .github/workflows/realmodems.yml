# The real Direwolf and the real Mercury that NeoAPRS carries, built by the scripts the release builds
# them with, and what proves a modem update (docs/modem-updates.md). On Linux, five NeoAPRS daemons on
# three virtual sound cables (PipeWire null sinks): a gateway's pair carries messages and acks between
# VHF and HF, a WIDE path alone and a message to the gateway stay off HF, two stations exchange a
# message at 300 baud, the Mercury pinned now and the one pinned before carry a message and its ack both
# ways, and the lines the daemon reads of Mercury are the ones it writes (tests/realmodems,
# docs/realmodems.md); then the suite's tests of the real programs. On Windows, the two modems built
# for it: Direwolf's demodulator decodes the recordings, Mercury ends in order on Ctrl-Break. Keying is VOX
# into a null sink, so nothing is keyed. On every push to master, every night and by hand; no secrets.
name: realmodems

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NEOAPRS_UPDATE_CHECK: "0"
  UV_FROZEN: "1"

concurrency:
  group: realmodems-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}  # every push to master is checked to the end

jobs:
  realmodems:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step uses git with the job's token
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.13"
          enable-cache: true
      # The runners' kernels have no sound (no snd-aloop), so the cables are PipeWire null sinks and
      # the ALSA devices of tests/realmodems/asoundrc (docs/realmodems.md); a tone played into one
      # end of the HF cable must be heard at the other.
      - name: The virtual sound cables
        timeout-minutes: 10  # a tone that never ends is the runner's sound hanging, not a test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pipewire pipewire-pulse pipewire-alsa wireplumber pulseaudio-utils alsa-utils dbus
          tests/realmodems/cables
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"  # what the script gave $GITHUB_ENV for the later steps
          python3 -c "import math, struct, sys; sys.stdout.buffer.write(b''.join(struct.pack('<h', int(8000 * math.sin(i / 8))) for i in range(48000)))" > "$RUNNER_TEMP/tone.raw"
          arecord -M -D hf_b -t raw -f S16_LE -r 48000 -c 1 -d 3 "$RUNNER_TEMP/heard.raw" &
          aplay -M -D hf_g -t raw -f S16_LE -r 48000 -c 1 "$RUNNER_TEMP/tone.raw"
          wait
          python3 -c "import struct, sys; d = open(sys.argv[1], 'rb').read(); peak = max(abs(v) for (v,) in struct.iter_unpack('<h', d)); print('frames', len(d) // 2, 'peak', peak); sys.exit(peak < 1000)" "$RUNNER_TEMP/heard.raw"
      - name: The tools of the modem builds
        run: sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libasound2-dev libasound2-data libudev-dev
      - run: uv sync --frozen
      # The modems are built by the scripts the release builds them with, into the venv, and kept as
      # soon as they are built. Mercury's key is the one of ci.yml's job sim, so either job finds the
      # other's build.
      - name: The image of the runner, for the keys of the caches
        id: image
        run: echo "name=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: The Mercury built before
        id: mercury
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv/tools/mercury
          key: mercury-sim-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.name }}-${{ hashFiles('scripts/build-mercury', 'neoaprs/mercury.py', 'packaging/mercury/**') }}
      - name: Build the pinned Mercury into the venv (scripts/build-mercury --install)
        if: steps.mercury.outputs.cache-hit != 'true'
        run: uv run scripts/build-mercury --install
      - if: steps.mercury.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv/tools/mercury
          key: ${{ steps.mercury.outputs.cache-primary-key }}
      - name: The previous Mercury built before
        id: previous
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv/tools/mercury-previous
          key: mercury-previous-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.name }}-${{ hashFiles('scripts/build-mercury', 'neoaprs/mercury.py', 'packaging/mercury/**') }}
      - name: Build the Mercury pinned before into the venv (scripts/build-mercury --previous --install)
        if: steps.previous.outputs.cache-hit != 'true'
        run: uv run scripts/build-mercury --previous --install
      - if: steps.previous.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv/tools/mercury-previous
          key: ${{ steps.previous.outputs.cache-primary-key }}
      - name: The Direwolf built before
        id: direwolf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv/tools/direwolf
          key: direwolf-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.name }}-${{ hashFiles('scripts/build-direwolf', 'scripts/buildtool.py', 'neoaprs/direwolf.py', 'packaging/direwolf/**') }}
      - name: Build the pinned Direwolf into the venv (scripts/build-direwolf --install)
        if: steps.direwolf.outputs.cache-hit != 'true'
        run: uv run scripts/build-direwolf --install
      - if: steps.direwolf.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv/tools/direwolf
          key: ${{ steps.direwolf.outputs.cache-primary-key }}
      - name: The stations and the scenarios
        env:
          NEOAPRS_REAL_MODEMS: "1"
        run: >-
          uv run pytest -v -p no:cacheprovider --confcutdir tests/realmodems
          -o faulthandler_timeout=0 -o tmp_path_retention_policy=all
          --basetemp "$RUNNER_TEMP/realmodems" tests/realmodems
      # The suite's tests of the real programs: the guard of the suite (tests/conftest.py) keeps the
      # programs of the venv from every test, so they run here, past it, on a runner with no sound card.
      - name: The suite's tests of the real Direwolf and Mercury
        run: >-
          uv run pytest -v -p no:cacheprovider --confcutdir tests/realmodems
          tests/test_direwolf_real.py tests/test_mercury_leadin.py tests/test_mercury_scope_real.py
      - name: The stations' folders (each daemon's log and output, the modems' configurations)
        if: always()
        run: tar czf realmodems-stations.tar.gz -C "$RUNNER_TEMP" realmodems || echo "no folder"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realmodems-stations
          path: realmodems-stations.tar.gz
          if-no-files-found: ignore

  # The two modems for Windows, as the release builds them (release.yml, mercury-windows and
  # direwolf-windows), with Direwolf's decoder of recorded audio beside it for the job below.
  windows-builds:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    container: debian:trixie
    steps:
      - name: The tools of the builds (a bare container has none)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake python3 ca-certificates git patch file gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-x86-64-dev mingw-w64-common
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step uses git with the job's token
      - run: python3 scripts/build-mercury --windows --out modems
      - run: python3 scripts/build-direwolf --windows --with-atest --out modems
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realmodems-windows-builds
          path: |
            modems/mercury
            modems/direwolf
          if-no-files-found: error

  windows:
    needs: windows-builds
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step uses git with the job's token
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: realmodems-windows-builds
          path: ${{ runner.temp }}/modems
      - name: Direwolf's demodulator for Windows on the recordings, Mercury's end on Ctrl-Break and its log through a pipe
        env:
          NEOAPRS_REAL_MODEMS: "1"
          NEOAPRS_WINDOWS_MODEMS: ${{ runner.temp }}/modems
        run: uv run pytest -v -p no:cacheprovider --confcutdir tests/realmodems tests/realmodems/test_windows.py
      - name: mercury.exe listens on 127.0.0.1 only
        run: uv run python packaging/windows/smoke_mercury.py "${{ runner.temp }}/modems/mercury/mercury.exe"
