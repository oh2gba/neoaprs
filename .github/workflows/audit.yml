# The weekly audit: the packages of uv.lock and ui/package-lock.json against the advisory lists
# (osv-scanner, `scripts/check --stage audit`; osv-scanner.toml lists what is set aside, each with a
# reason and an end day), and GitHub's runners against packaging/ci/runner.json. Advisories and
# image moves come without a push, so it runs by the clock. It is a workflow of its own because the
# release requires a green ci.yml run by commit, which a scheduled run on master's head would be. No
# secrets, nothing is published.
name: audit

on:
  schedule:
    - cron: "17 5 * * 1"  # Mondays 05:17 UTC (off the hour, when runners are busiest)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step uses git with the job's token
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: The pinned osv-scanner (scripts/security-tools)
        run: python3 scripts/security-tools osv-scanner
      # The stage also reads what GitHub publishes of its runners (scripts/runner-facts --published
      # --announcements): the image readme and open announcements naming a runner we use. The job's
      # token only lifts the anonymous API limit.
      - run: scripts/check --stage audit
        env:
          GH_TOKEN: ${{ github.token }}

  # Whether each -latest label is still the system the workflows name (packaging/ci/runner.json,
  # "latest"): this says within a week that GitHub moved a label (docs/MAINTAINING.md, "When GitHub
  # moves an image").
  latest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step uses git with the job's token
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: false  # nothing is installed: the script needs the standard library only
      - run: uv run --no-project python scripts/runner-facts --latest "$LABEL" --github
        env:
          LABEL: ${{ matrix.os }}
