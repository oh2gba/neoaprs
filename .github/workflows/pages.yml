# The old address of the project page, https://oh2gba.github.io/neoaprs/, sends its visitors to https://neo.oh2gba.eu (the page itself, uploaded by server/deploy.sh --site): it publishes
# packaging/pages-redirect/, a page that moves the browser on at once (with a canonical link, which search engines take as a permanent move) and a 404 page that does the same for any other path. Run by hand.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false     # (no later step uses git with the job's token)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packaging/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
