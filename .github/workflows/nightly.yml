# The tests marked nightly (tests/support/timebudget.py): too slow for the gate and for what a push
# must pass, run each night on both systems, and by hand on any branch; then the random-input tests
# with twenty times the examples and a new seed (the profile nightly of tests/conftest.py). A red run
# is a fault to mend or a flake for docs/flakes.md, never a run to repeat. No secrets, nothing is published.
name: nightly

on:
  push:
    branches: ["try/r21-t"]
  schedule:
    - cron: "43 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NEOAPRS_UPDATE_CHECK: "0"
  UV_FROZEN: "1"

jobs:
  slow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no later step uses git with the job's token
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.13"
          enable-cache: true
      - name: System libraries of the Qt web engine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libnss3 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxkbfile1
      - run: uv sync --frozen --extra app --extra ble
      - run: uv run pytest -n auto --dist loadgroup -m nightly --durations=30
      - name: The random-input tests with twenty times the examples
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HYPOTHESIS_PROFILE: nightly
        run: uv run pytest -n auto -p no:randomly tests/test_properties_*.py tests/test_tnc2text.py tests/test_settings_reach.py
