# The ALSA configuration of a modem on a sound server's device (neoaprs/soundserver.py), run on the
# system's ALSA library: the system's own configuration (one file: some ALSA versions read no list in
# ALSA_CONFIG_PATH), then the names NeoAPRS gives such a device, by its index. neoaprs_pa:<index> goes
# through PulseAudio's plug-in (pipewire-pulse too), neoaprs_pw:<index> through PipeWire's; the plug lets a
# program that asks for mmap access use them. neoaprs_pa_ch<N>:<index>,<count> reads the device with all
# its channels, so that the server mixes none of them, and gives channel N alone.

</usr/share/alsa/alsa.conf>

pcm.neoaprs_pa {
	@args [ DEVICE ]
	@args.DEVICE { type string }
	type plug
	slave.pcm { type pulse device $DEVICE }
}
pcm.neoaprs_pw {
	@args [ DEVICE ]
	@args.DEVICE { type string }
	type plug
	slave.pcm { type pipewire playback_node $DEVICE capture_node $DEVICE }
}
pcm.neoaprs_pa_ch0 {
	@args [ DEVICE CHANNELS ]
	@args.DEVICE { type string }
	@args.CHANNELS { type integer }
	type plug
	slave.pcm { type route slave { pcm { type plug slave.pcm { type pulse device $DEVICE } } channels $CHANNELS } ttable.0.0 1 }
}
