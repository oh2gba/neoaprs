# The ALSA names NeoAPRS gives a modem for a device of the sound server (neoaprs/soundserver.py).
# neoaprs_pulse:DEVICE=<node> and neoaprs_pipewire:DEVICE=<node> open the whole device; the plug lets a
# program that asks for mmap access use it. neoaprs_<plugin>_ch<N>:DEVICE=<node>,CHANNELS=<count> reads
# the device with all its channels, so that the server mixes none of them, and gives channel N alone.

pcm.neoaprs_pulse {
	@args [ DEVICE ]
	@args.DEVICE { type string }
	type plug
	slave.pcm { type pulse device $DEVICE }
}
pcm.neoaprs_pipewire {
	@args [ DEVICE ]
	@args.DEVICE { type string }
	type plug
	slave.pcm { type pipewire playback_node $DEVICE capture_node $DEVICE }
}
pcm.neoaprs_pulse_ch0 {
	@args [ DEVICE CHANNELS ]
	@args.DEVICE { type string }
	@args.CHANNELS { type integer }
	type plug
	slave.pcm { type route slave { pcm { type plug slave.pcm { type pulse device $DEVICE } } channels $CHANNELS } ttable.0.0 1 }
}
