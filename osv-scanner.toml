# The advisories that `scripts/security-check --audit` (osv-scanner over uv.lock and ui/package-lock.json) sets aside.
# An entry is one advisory that cannot reach NeoAPRS as it uses the package, with the reason and the day the entry ends: from that day the advisory fails the audit again and is looked at again.
# An advisory against something the installers carry (uv.lock, and of the page maplibre-gl, pmtiles, uqr and vue) is not set aside: the package is moved to the fixed version.
# The check refuses an entry without a reason or an end. docs/security-checks.md says how an entry is added.

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
effectiveUntil = 2027-02-13
reason = "glob: a walk that was cancelled by a signal goes on reading folders. glob is here under the page's test library (@vue/test-utils, by way of js-beautify), which walks no folder an outsider names and cancels nothing, and it is not in the built page. The fix is in glob 14, which js-beautify does not take yet."
