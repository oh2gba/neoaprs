[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "neoaprs"
dynamic = ["version"]                      # the one version is VERSION in neoaprs/__init__.py (below)
description = "NeoAPRS: a modern, easy-to-use APRS client with a map, messages and a web page, as a desktop app or a service"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "OH2GBA", email = "john@oh2gba.eu" }]
requires-python = ">=3.13"
# What the daemon imports at run time (neoaprs/, the page's server neoaprs/web/ included): the standard library, pyserial for the radio's serial port (neoaprs/serialport.py), Tornado for the page, pydantic for the messages of the page (neoaprs/web/protocol.py), cryptography for the certificates of the secure connection (neoaprs/web/tls.py), and certifi, Mozilla's list of root certificates, trusted beside the system's for every https request NeoAPRS makes (neoaprs/httpstrust.py): a fresh Windows fetches a missing root only when a browser asks for it, so its own list may lack GitHub's.
dependencies = [
    "tornado==6.6",
    "pydantic==2.14.0",
    "pyserial==3.5",
    "cryptography==50.0.2",
    "certifi==2026.10.23",
]

# The desktop app (`neoaprs app`, `neoaprs-app`; neoaprs/desktop/) is an extra, so that `uv tool install neoaprs` for the daemon stays lean. Windows: the page in the system's WebView2 (pywebview) and the tray icon
# (pystray, which draws it from a Pillow image). Elsewhere: Qt, whose QtWebEngine (PySide6-WebEngine, which needs the Essentials and the Addons) is the window and whose QSystemTrayIcon is the tray, so one event loop does both.
[project.optional-dependencies]
app = [
    "pywebview==6.2.1; sys_platform == 'win32'",
    "pystray==0.19.5; sys_platform == 'win32'",
    "Pillow==13.0.0; sys_platform == 'win32'",
    "PySide6-Essentials==6.12.0; sys_platform != 'win32'",
    "PySide6-Addons==6.12.0; sys_platform != 'win32'",
    "PySide6-WebEngine==6.12.0.140; sys_platform != 'win32'",
]
# A Bluetooth Low Energy KISS TNC as a port (`ble://AA:BB:CC:DD:EE:FF`; neoaprs/btle.py): bleak, which talks to BlueZ on Linux, CoreBluetooth on macOS and WinRT on Windows. An extra, because only a BLE radio needs it.
ble = [
    "bleak==3.0.2",
]

[project.urls]
Homepage = "https://neo.oh2gba.eu/"
Repository = "https://github.com/oh2gba/neoaprs"
Issues = "https://github.com/oh2gba/neoaprs/issues"
Releases = "https://github.com/oh2gba/neoaprs/releases"

# `neoaprs` is the command (run, service, map, db, replay, capture, doctor, open, stop, app); `neoaprsw` is the same without a console window, which is how Windows starts it at login. `neoaprs-app` is the desktop
# app (the same as `neoaprs app`); `neoaprs-app --tray` is how Windows and the desktops of Linux start it at sign-in.
[project.scripts]
neoaprs = "neoaprs.cli:main"

[project.gui-scripts]
neoaprsw = "neoaprs.cli:gui_main"
neoaprs-app = "neoaprs.desktop.cmd:gui_main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "mypy==2.4.0",
    "ruff==0.17.0",
    "hypothesis==6.168.5",
    "coverage==7.16.2",
    "pytest-xdist==3.8.0",
]
# The Windows app is frozen with PyInstaller, built from its source (the bootloader compiled on the runner); the lock holds the hash of the source and of every package it needs.
pyinstaller = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.8",
]

# The wheel is the package neoaprs/ with everything in it that is not Python: the built page (neoaprs/page/, committed, so building needs no node), the placeholder page, the unit template. The sdist is the
# package, the licence and the build's own files.
[tool.hatch.version]
path = "neoaprs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["neoaprs"]

[tool.hatch.build.targets.sdist]
include = ["/neoaprs", "/LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
# The folder of a test that passed is taken down when it ends (only a failed test keeps its folder to look at).
tmp_path_retention_policy = "failed"
# The markers are given by tests/support/markers.py (every test is exactly one of unit / integration); a test sets expects_errors itself. See tests/README.md.
markers = [
    "unit: pure code in one process: no event loop, no daemon, no socket",
    "integration: the daemon (Controller), the web server or a fake service on the loopback",
    "safety: guards the data: storage, migrations, the database actor and everything under tests/safety (run alone with -m safety)",
    "expects_errors: the test makes the code log an ERROR on purpose (any other test that does fails, see tests/support/guards.py)",
]
filterwarnings = ["error::DeprecationWarning:neoaprs.*"]
# A test that is still running after two minutes has the stack of every thread written to stderr (the standard library's faulthandler; the test goes on): a test that hangs then says where, instead of only costing the job its half hour.
faulthandler_timeout = 120

# scripts/coverage runs the suite under coverage.py. Branches count; the daemons and commands the tests start as processes are measured too (patch = subprocess), and every process writes its own data file (parallel),
# which the script combines. Nothing is excluded: a line that is not covered shows in the table.
[tool.coverage.run]
branch = true
source = ["neoaprs"]
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["neoaprs", "tests"]   # the test support layer is typed like the code; the test files are read with what they use (the overrides below), for both systems, so that a name that one system lacks is found here and not on GitHub

# A test file is read for what is wrong with its names, on each system (--platform win32 too): a function or a constant that Windows does not have, a module that is not there, an attribute that is not. How the doubles of a
# test are typed is left to the test: no signature is demanded, and the checks of a value's type, which a stand-in always fails, are off. tests/support is typed like the code, as the next section says.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_subclassing_any = false
warn_return_any = false
warn_unused_ignores = false
warn_unreachable = false
implicit_reexport = true
check_untyped_defs = true
disable_error_code = ["arg-type", "union-attr", "comparison-overlap", "func-returns-value", "misc", "index", "var-annotated", "assignment", "operator", "return-value", "override", "call-overload"]

[[tool.mypy.overrides]]
module = "tests.support.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = ["arg-type", "union-attr", "comparison-overlap", "func-returns-value", "misc", "index", "var-annotated", "assignment", "operator", "return-value", "override", "call-overload"]

# The tests patch what a module imported (`monkeypatch.setattr(module.os, ...)`, `module.sys`) and import what another test file imported, which strict mypy calls a name that the module does not export.
[[tool.mypy.overrides]]
module = "neoaprs.*"
implicit_reexport = true

[tool.ruff]
target-version = "py313"
extend-exclude = ["ui", "neoaprs/page"]
# The tools that are Python and have no .py in their name: ruff knows a Python file by its ending and would pass these by, the release script among them. The list is exact: tests/test_lint_scope.py finds a tool
# that begins with a python line and is not here, and an entry whose file is gone or is not Python; the spec of the Windows build has no such line and is named there (NO_FIRST_LINE).
extend-include = [
    "scripts/build-mercury",
    "scripts/check-in-container",
    "scripts/check-windows",
    "scripts/check-installs",
    "scripts/doc-arch",
    "scripts/doc-settings",
    "scripts/flaky",
    "scripts/mercury-bench",
    "scripts/mercury-measure",
    "scripts/mercury-sim",
    "scripts/release",
    "scripts/security-check",
    "scripts/security-tools",
    "scripts/site-check",
    "packaging/windows/neoaprs.spec",
]

[tool.ruff.lint]
# Lint only (no formatter: the code base keeps its own long-line style). pycodestyle errors and warnings and pyflakes, plus flake8-bugbear for real bugs and the security rules (S, the rules of bandit).
# A security rule is switched off below only where it cannot tell what it looks for from what this code does all the time; a single line that is right as it is says so itself (`# noqa: S310  (why)`).
select = ["E", "F", "W", "B", "S"]
ignore = [
    "E501",   # line length: the house style allows long lines
    "E741",   # `l` for a line in a comprehension or a lambda is how the tests and the parsers read
    "B905",   # zip() without strict=: a zip pairs a column list with a row of the same table, and strict= would turn an old database with an extra column into a crash
    "S101",   # assert: in neoaprs/ an assert tells mypy that a value is there (`assert self._app is not None`); none of them checks what came from outside, which is what the rule is for
    "S603",   # every start of a program from a list of arguments, whatever the arguments are: the rule cannot tell a constant from a stranger's text. A shell line stays reported where ruff knows it: subprocess with shell=True (S602), any other call with shell=True (S604), os.system, os.popen and subprocess.getoutput (S605); a start through os.exec, os.spawn or os.startfile too (S606). asyncio.create_subprocess_shell and the event loop's subprocess_shell are known to no rule of ruff: SHELL_LINES of tests/test_architecture.py holds them, and REACHES_OUT there lists the modules that start a program at all
]

[tool.ruff.lint.per-file-ignores]
# The homes of SQL (tests/test_architecture.py, SQL_HOMES) put a statement together from the column lists and the conditions written in the same module, and bind every value (`?`); the rule sees an f-string and cannot tell a column list from a value. Everywhere else it stays on.
"neoaprs/*sql.py" = ["S608"]
"neoaprs/migrationsteps*.py" = ["S608"]
# The tests are not what runs at an operator's: they assert, make up keys and addresses, listen on what they like, start the commands and seed a database with SQL of their own.
"tests/**" = ["S"]
# A developer's tool and a build's own check find the system's programs (git, tasklist, netstat) on the PATH, as the shell they are run from does; in neoaprs/ each such start says why (`# noqa: S607`).
"scripts/**" = ["S607"]
"packaging/**" = ["S607"]
"packaging/windows/neoaprs.spec" = ["F821"]       # the names the Windows build's tool gives a spec file (Analysis, PYZ, EXE, COLLECT, SPECPATH)

[tool.uv]
# pyobjc (bleak's on macOS) held at the version the 0.16 macOS app shipped with: a relock for another package would otherwise move it, and a fix release changes only what it fixes
constraint-dependencies = ["pyobjc-core==12.2.2", "pyobjc-framework-cocoa==12.2.2"]
